name: Alta snowmaking

on:
  schedule:
    # Hourly, 17 min past (the roundup scraper runs at :03). Observations + trend refresh every run;
    # model data is re-pulled only when the cache is ~4 h old (see REFRESH_H in snowmaking.R).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snowmaking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr any::jsonlite

      - name: Update observations/trend, pull models if due, build dashboard
        run: Rscript snowmaking.R

      - name: Commit model-data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_cache.csv
          git diff --cached --quiet || (git commit -m "Update forecast cache" && git pull --rebase && git push)

      - name: Prepare site
        run: cp output/snowmaking.html output/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
